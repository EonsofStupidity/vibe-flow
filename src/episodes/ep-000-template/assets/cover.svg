<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Frontier vs local LLM stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e28"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="'JetBrains Mono', monospace" fill="#f2e9d0">
    <text x="80" y="120" font-size="42" fill="#f5b642">FRONTIER WEB AI</text>
    <text x="900" y="120" font-size="42" fill="#f5b642">LOCAL LLM</text>
    <g transform="translate(80,180)" stroke="#3a4050" stroke-width="1.5" fill="none">
      <rect width="620" height="90" rx="12"/><rect y="110" width="620" height="90" rx="12"/>
      <rect y="220" width="620" height="90" rx="12"/><rect y="330" width="620" height="90" rx="12"/>
      <rect y="440" width="620" height="90" rx="12"/>
    </g>
    <g transform="translate(80,180)" font-size="26">
      <text x="24" y="56">Prompt · Chat UI</text>
      <text x="24" y="166">Router · Rate limits</text>
      <text x="24" y="276">Hosted model (GPT/Claude)</text>
      <text x="24" y="386">Provider infra</text>
      <text x="24" y="496">Someone else's GPU</text>
    </g>
    <g transform="translate(900,180)" stroke="#3a4050" stroke-width="1.5" fill="none">
      <rect width="620" height="90" rx="12"/><rect y="110" width="620" height="90" rx="12"/>
      <rect y="220" width="620" height="90" rx="12"/><rect y="330" width="620" height="90" rx="12"/>
      <rect y="440" width="620" height="90" rx="12"/>
    </g>
    <g transform="translate(900,180)" font-size="26">
      <text x="24" y="56">Prompt · Chat UI</text>
      <text x="24" y="166">llama.cpp · Ollama</text>
      <text x="24" y="276">Local model (7B–70B)</text>
      <text x="24" y="386">Your machine</text>
      <text x="24" y="496">Your GPU / your problem</text>
    </g>
  </g>
</svg>
